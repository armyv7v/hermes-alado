name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: app — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  provisioner:
    name: provisioner — shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n provisioner/prepare.sh
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./provisioner
          severity: warning

  plugin:
    name: plugin — compile + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-plugin/droidbot_push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: python -m py_compile *.py dashboard/*.py
      - name: Install test deps
        run: pip install pywebpush pytest
      - name: Run tests
        run: python -m pytest tests/ -q
